name: redis-cache-topic
services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_MODE: ${CACHE_MODE:-cache_aside}
      FRESH_TTL: ${FRESH_TTL:-5}
      STALE_TTL: ${STALE_TTL:-10}
      SOURCE_DELAY: ${SOURCE_DELAY:-0.1}
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
  tests:
    build: .
    profiles: ["test"]
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/workspace
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]
